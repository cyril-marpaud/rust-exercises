[workspace]
# Course order, followed by the reports: do not sort.
default-members = [
	"exercises/e01_fibzz",
	"exercises/e02_temperature",
	"exercises/e03_modularization",
	"exercises/e04_quiz",
	"exercises/e05_traits",
	"exercises/e06_iterators",
	"crates/c_serde",
]
members = [
	"crates/c_flatbuffers",
	"crates/c_prost",
	"crates/c_pyo3/rust_from_python",
	"crates/c_pyo3/python_from_rust",
	"crates/c_reqwest",
	"crates/c_reqwest/assets/c_reqwest_server",
	"crates/c_serde",
	"exercises/e01_fibzz",
	"exercises/e02_temperature",
	"exercises/e03_modularization",
	"exercises/e04_quiz",
	"exercises/e05_traits",
	"exercises/e06_iterators",
	"projects/p_ferroscope",
	"projects/p_multithreading",
	"xtask",
]
resolver = "3"

[workspace.package]
authors = ["Cyril Marpaud"]
categories = ["rust-patterns"]
description = "Rust exercises for training sessions"
documentation = "https://gitlab.com/hay-stack/bashroom/rust/rust-exercises/-/blob/main/README.md"
edition = "2024"
homepage = "https://gitlab.com/hay-stack/bashroom/rust/rust-exercises"
keywords = ["training", "rust", "exercises"]
license = "CC-BY-NC-SA-4.0"
publish = false
readme = "README.md"
repository = "https://gitlab.com/hay-stack/bashroom/rust/rust-exercises"
version = "0.1.0"

# Competency attested for each crate whose required tests pass at least partly, worded to follow "A démontré une maîtrise complète" or "partielle".
[workspace.metadata.competencies]
e01_fibzz = "des fondamentaux du langage (conditions, types numériques, conversions, diagnostics du compilateur)"
e02_temperature = "des types personnalisés (structures, énumérations, implémentations, passage d'arguments par valeur ou par référence)"
e03_modularization = "de l'organisation du code en modules (fichiers, visibilité, prélude)"
e04_quiz = "de la gestion des erreurs (type Result, erreurs personnalisées, propagation, bibliothèque thiserror)"
e05_traits = "des traits standard (dérivation, implémentation manuelle, surcharge d'opérateurs)"
e06_iterators = "des itérateurs (traits Iterator et IntoIterator, gestion d'un état interne)"
c_serde = "de la désérialisation de données (bibliothèques serde et serde_json, attributs, structures imbriquées)"
